<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="35%" stop-color="#f4f4f4"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#a8a8a8"/>
    </linearGradient>
    <radialGradient id="endCap" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#888"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#2a2a2a"/>
  <!-- shelf surface -->
  <rect y="220" width="400" height="80" fill="#3a3a3a"/>
  <line x1="0" y1="220" x2="400" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <!-- pin shadow -->
  <ellipse cx="200" cy="225" rx="120" ry="6" fill="#000" opacity="0.5"/>
  <!-- pin body -->
  <rect x="80" y="195" width="240" height="30" fill="url(#metalGrad)" stroke="#666" stroke-width="0.5"/>
  <!-- left end cap -->
  <ellipse cx="80" cy="210" rx="3" ry="15" fill="url(#endCap)"/>
  <!-- right end cap -->
  <ellipse cx="320" cy="210" rx="3" ry="15" fill="url(#endCap)"/>
  <!-- subtle highlight -->
  <rect x="80" y="200" width="240" height="2" fill="#fff" opacity="0.6"/>
  <!-- shelf label hint -->
  <text x="200" y="280" text-anchor="middle" font-family="monospace" font-size="12" fill="#888">Aisle 3 / Shelf B</text>
</svg>
