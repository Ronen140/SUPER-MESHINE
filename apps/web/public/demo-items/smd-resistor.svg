<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0a0a"/>
  <!-- cut tape body (beige) -->
  <rect x="60" y="120" width="280" height="60" fill="#d6c894" stroke="#a89858" stroke-width="1"/>
  <!-- sprocket holes -->
  <circle cx="80" cy="135" r="4" fill="#0a0a0a"/>
  <circle cx="120" cy="135" r="4" fill="#0a0a0a"/>
  <circle cx="160" cy="135" r="4" fill="#0a0a0a"/>
  <circle cx="200" cy="135" r="4" fill="#0a0a0a"/>
  <circle cx="240" cy="135" r="4" fill="#0a0a0a"/>
  <circle cx="280" cy="135" r="4" fill="#0a0a0a"/>
  <circle cx="320" cy="135" r="4" fill="#0a0a0a"/>
  <!-- pockets with resistors (0805 black ceramic) -->
  <g>
    <rect x="93" y="155" width="14" height="10" fill="#1a1a1a" stroke="#888" stroke-width="0.4"/>
    <rect x="133" y="155" width="14" height="10" fill="#1a1a1a" stroke="#888" stroke-width="0.4"/>
    <rect x="173" y="155" width="14" height="10" fill="#1a1a1a" stroke="#888" stroke-width="0.4"/>
    <rect x="213" y="155" width="14" height="10" fill="#1a1a1a" stroke="#888" stroke-width="0.4"/>
    <rect x="253" y="155" width="14" height="10" fill="#1a1a1a" stroke="#888" stroke-width="0.4"/>
    <rect x="293" y="155" width="14" height="10" fill="#1a1a1a" stroke="#888" stroke-width="0.4"/>
    <!-- silver caps on each side -->
    <rect x="93" y="155" width="2" height="10" fill="#c0c0c0"/>
    <rect x="105" y="155" width="2" height="10" fill="#c0c0c0"/>
    <rect x="133" y="155" width="2" height="10" fill="#c0c0c0"/>
    <rect x="145" y="155" width="2" height="10" fill="#c0c0c0"/>
    <rect x="173" y="155" width="2" height="10" fill="#c0c0c0"/>
    <rect x="185" y="155" width="2" height="10" fill="#c0c0c0"/>
    <rect x="213" y="155" width="2" height="10" fill="#c0c0c0"/>
    <rect x="225" y="155" width="2" height="10" fill="#c0c0c0"/>
    <rect x="253" y="155" width="2" height="10" fill="#c0c0c0"/>
    <rect x="265" y="155" width="2" height="10" fill="#c0c0c0"/>
    <rect x="293" y="155" width="2" height="10" fill="#c0c0c0"/>
    <rect x="305" y="155" width="2" height="10" fill="#c0c0c0"/>
  </g>
  <!-- cover tape edge -->
  <line x1="60" y1="180" x2="340" y2="180" stroke="#a89858" stroke-width="1"/>
  <text x="200" y="270" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">SMD 0805 1kΩ — cut tape on SMT line</text>
</svg>
