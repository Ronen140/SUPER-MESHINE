<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#1a1a1a"/>
  <!-- PCB body (FR4 green) -->
  <rect x="60" y="60" width="280" height="180" fill="#0d4f1f" stroke="#0a3a17" stroke-width="2" rx="3"/>
  <!-- silkscreen white outlines -->
  <rect x="70" y="70" width="260" height="160" fill="none" stroke="#fafafa" stroke-width="0.6" opacity="0.55"/>
  <!-- mounting holes -->
  <circle cx="80" cy="80" r="5" fill="#0a0a0a" stroke="#888" stroke-width="0.5"/>
  <circle cx="320" cy="80" r="5" fill="#0a0a0a" stroke="#888" stroke-width="0.5"/>
  <circle cx="80" cy="220" r="5" fill="#0a0a0a" stroke="#888" stroke-width="0.5"/>
  <circle cx="320" cy="220" r="5" fill="#0a0a0a" stroke="#888" stroke-width="0.5"/>
  <!-- HASL pads sample (silver) -->
  <g fill="#cfcfcf">
    <rect x="120" y="110" width="40" height="6"/>
    <rect x="120" y="125" width="40" height="6"/>
    <rect x="120" y="140" width="40" height="6"/>
    <rect x="120" y="155" width="40" height="6"/>
    <rect x="240" y="110" width="40" height="6"/>
    <rect x="240" y="125" width="40" height="6"/>
    <rect x="240" y="140" width="40" height="6"/>
    <rect x="240" y="155" width="40" height="6"/>
  </g>
  <!-- traces -->
  <g stroke="#cfa867" stroke-width="1.5" fill="none">
    <path d="M 162 113 L 200 113 L 200 158 L 238 158"/>
    <path d="M 162 128 L 220 128 L 220 143 L 238 143"/>
    <path d="M 162 158 L 180 158 L 180 195 L 238 195"/>
  </g>
  <!-- silk text -->
  <text x="200" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#fafafa" opacity="0.7">SUPER-MESHINE PROTO v0.1</text>
  <text x="200" y="270" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">Blank PCB 100×80mm — 2-layer FR4</text>
</svg>
